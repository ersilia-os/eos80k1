Title: Bioactivity Similarity Index
Description: Encodes a molecule as 64 values read from the hidden layer of the Bioactivity
  Similarity Index, a network Schottlender and colleagues trained on ChEMBL to judge
  whether two compounds bind the same or a related protein family. Their starting
  point was that 60% of similarly bioactive ligand pairs sit below a Tanimoto coefficient
  of 0.30 and so escape fingerprint comparison. Ersilia serves the cross-family BSI-Large
  weights as a featuriser, so these numbers are a by-product of a pairwise classifier.
