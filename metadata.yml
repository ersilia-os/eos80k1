Title: Bioactivity Similarity Index
Description: Encodes a molecule into 64 features intended to capture functional rather
  than structural resemblance, so that compounds acting alike are placed together
  even when their skeletons differ. The Bioactivity Similarity Index was built to
  address a known weakness of fingerprint-based comparison, where Tanimoto similarity
  misses functionally equivalent molecules that share no obvious substructures. Similarity
  in this space reflects predicted biological behaviour, so it complements rather
  than replaces structural comparison.
